name: 'Setup Python and uv'
description: 'Common setup for Python, uv, and dependencies'
inputs:
  python-version:
    description: 'Python version to set up'
    required: false
    default: "3.11"
  sync-groups:
    description: 'uv sync groups'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - uses: actions/checkout@v4

    # Phase 173: Disable all uv caching layers (both our actions/cache
    # and ``astral-sh/setup-uv``'s built-in cache). With caching fully
    # off, ``uv sync`` re-downloads packages from PyPI every job but
    # makes the venv state 100% deterministic — eliminating the
    # risk of pytest dying with exit code 102 during collection when
    # a stale cached package set is restored after the GitHub Ubuntu
    # runner image was bumped around 2026-07-10. Package reinstall
    # takes ~15s on the GHA network and is acceptable for our
    # 30-minute timeout.
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "0.7.8"
        enable-cache: "false"

    - name: Install dependencies
      shell: bash
      run: |
        if [ -n "${{ inputs.sync-groups }}" ]; then
          uv sync --group ${{ inputs.sync-groups }}
        else
          uv sync
        fi
