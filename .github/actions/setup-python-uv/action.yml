name: 'Setup Python and uv'
description: 'Common setup for Python, uv, and dependencies'
inputs:
  python-version:
    description: 'Python version to set up'
    required: false
    default: "3.11"
  sync-groups:
    description: 'uv sync groups'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - uses: actions/checkout@v4

    # Phase A-12: cache uv download and project virtualenv between runs to
    # avoid reinstalling the full dev toolchain on every job.
    - name: Cache uv
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/uv
          .venv
        key: ${{ runner.os }}-uv-${{ inputs.python-version }}-${{ inputs.sync-groups || 'default' }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-uv-${{ inputs.python-version }}-${{ inputs.sync-groups || 'default' }}-

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "0.7.8"

    - name: Install dependencies
      shell: bash
      run: |
        if [ -n "${{ inputs.sync-groups }}" ]; then
          uv sync --group ${{ inputs.sync-groups }}
        else
          uv sync
        fi
