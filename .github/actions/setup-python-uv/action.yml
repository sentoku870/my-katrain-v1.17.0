name: 'Setup Python and uv'
description: 'Common setup for Python, uv, and dependencies'
inputs:
  python-version:
    description: 'Python version to set up'
    required: false
    default: "3.11"
  sync-groups:
    description: 'uv sync groups'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - uses: actions/checkout@v7

    # Cache uv's wheel download cache ONLY (not the .venv itself).
    # Caching the .venv (which contains compiled kivy/SDL/ffpyplayer .so
    # files linked against specific glibc/symbol versions) across runs is
    # fragile: a cache saved under one runner image state and restored on
    # another can leave stale native modules that segfault on import,
    # surfacing as a silent exit code 102 during pytest collection.
    # uv sync rebuilds the .venv from the cached wheels in seconds, so we
    # trade a small per-job cost for reliable native-module loading.
    - name: Cache uv
      uses: actions/cache@v6
      with:
        path: |
          ~/.cache/uv
        key: ${{ runner.os }}-uv-${{ inputs.python-version }}-${{ inputs.sync-groups || 'default' }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-uv-${{ inputs.python-version }}-${{ inputs.sync-groups || 'default' }}-

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v8.3.2
      with:
        version: "0.11.29"

    - name: Install dependencies
      shell: bash
      run: |
        if [ -n "${{ inputs.sync-groups }}" ]; then
          uv sync --group ${{ inputs.sync-groups }}
        else
          uv sync
        fi
