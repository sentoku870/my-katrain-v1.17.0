name: 'Setup Python and uv'
description: 'Common setup for Python, uv, and dependencies'
inputs:
  python-version:
    description: 'Python version to set up'
    required: false
    default: "3.11"
  sync-groups:
    description: 'uv sync groups'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - uses: actions/checkout@v4

    # Phase 173: cache ONLY `~/.cache/uv` (portable package downloads).
    #
    # The previous configuration also cached `.venv`, which contains
    # Python interpreter binaries, compiled extension modules, and
    # `.pyc` bytecode tied to a specific (OS, Python build, package set)
    # combination. Restoring it via `restore-keys` partial match — or
    # even via the exact key when pyproject.toml had drifted — could
    # leave the venv in a state where `uv sync` would not fully
    # reconcile it. Pytest then crashed during collection with
    # exit code 102 (an internal error emitted when subprocess
    # interpretation dies). Forcing a fresh `uv sync` per job is
    # the only safe option; rebuilding from `~/.cache/uv` is fast
    # enough (typically 10-15s) that the loss of caching the venv
    # itself is acceptable.
    - name: Cache uv download cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/uv
        key: ${{ runner.os }}-uv-cache-${{ inputs.python-version }}-${{ inputs.sync-groups || 'default' }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-uv-cache-${{ inputs.python-version }}-${{ inputs.sync-groups || 'default' }}-

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "0.7.8"

    - name: Install dependencies
      shell: bash
      run: |
        if [ -n "${{ inputs.sync-groups }}" ]; then
          uv sync --group ${{ inputs.sync-groups }}
        else
          uv sync
        fi
