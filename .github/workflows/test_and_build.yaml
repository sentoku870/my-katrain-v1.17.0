# .github/workflows/test_and_build.yaml

name: Test, Build, and Release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create draft release"
        required: true
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs (fast feedback). For push:main and manual
  # runs we wait for completion; cancellation there would risk leaving
  # main in an inconsistent state.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # This job runs first to prepare shared information for other jobs.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get project version
        id: version
        uses: ./.github/actions/get-version

  # Phase 112G: Type check with mypy (separate job for parallel execution)
  typecheck:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.11"
          sync-groups: dev

      - name: Type check with mypy
        run: uv run mypy katrain

  # Phase A-10: Lint with ruff (separate job for parallel execution)
  lint:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.11"
          sync-groups: dev

      - name: Lint and format check
        run: |
          uv run ruff check katrain tests
          uv run ruff format --check katrain tests

  test:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Phase 274-ci: add 3.13 to match .python-version / AGENTS.md primary env.
        # The Python 3.13 cell also carries the coverage gate (primary
        # dev env), so we run pytest --cov only there.
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - python-version: "3.13"
            coverage: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ matrix.python-version }}
          sync-groups: dev

      - name: Run tests
        env:
          # Force UTF-8 stdout/IO so .po/.mo/.kv files containing
          # Japanese glyphs are printable in CI logs without encoding
          # tricks. Pair with ``conftest.py`` setting the same vars.
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: 1
          # Skip Kivy's user-config dir (and silent mkdir of ~/.kivy)
          # BEFORE the KivyMD stub loader kicks in. KIVY_NO_CONFIG is
          # the single most effective env var for headless CI.
          KIVY_NO_CONFIG: 1
          KIVY_NO_ARGS: 1
          KIVY_NO_FILELOG: 1
          KIVY_NO_CONSOLELOG: 1
          KIVY_NO_ENV_CONFIG: 1
          KIVY_GL_BACKEND: mock
          # GHA runners have no audio device. Without an explicit null
          # driver, SDL2's audio probe can abort hard (C-level, no Python
          # traceback) during collection when kivy/ffpyplayer load.
          SDL_AUDIODRIVER: dummy
          PYTHONUNBUFFERED: 1
          # Surface C-level fatal errors as a readable traceback instead of
          # the silent exit-102 we have been seeing.
          PYTEST_FAULTHANDLER: 1
        run: |
          # Show memory info before tests
          echo "=== Memory before tests ==="
          free -m || true
          # Run under Xvfb (virtual X server). This is the fix for the
          # long-standing exit-102 collection crash:
          #   - SDL_VIDEODRIVER=dummy (previously set here) makes kivy's
          #     window init abort with "Couldn't connect to X server".
          #   - Even with SDL_VIDEODRIVER unset, kivymd.material_resources
          #     calls dp(400) at module load -> EventLoop.ensure_window()
          #     -> sys.exit(1) when no display is available.
          # No combination of env vars avoids both; a real (virtual) X
          # server is required. Xvfb is preinstalled on ubuntu-latest.
          # SDL_VIDEODRIVER and DISPLAY are intentionally NOT set here:
          # xvfb-run -a provides a real display and manages DISPLAY itself.
          #
          # ``--frozen`` skips the lock-vs-pyproject freshness check
          # entirely (we already ran ``uv sync --locked`` in the
          # composite action), so cached wheel metadata is not
          # revalidated on every matrix cell.
           xvfb-run -a uv run --frozen python -X faulthandler -m pytest tests -v --tb=short ${{ matrix.coverage && '--cov=katrain --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=60' || '' }} 2>&1
          exit_code=$?
          echo "=== Memory after tests ==="
          free -m || true
          echo "Exit code: $exit_code"
          exit $exit_code

      - name: Upload coverage report
        if: matrix.coverage && always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn


# Coverage was historically a separate job that re-ran the entire
  # pytest suite under Python 3.11 with --cov. After PR-F the
  # coverage gate runs inside the Python 3.13 cell of the test job
  # (which is also the project's primary dev env per AGENTS.md /
  # .python-version), so this standalone job would only duplicate
  # work. Removed. If we ever want a dedicated coverage dashboard
  # later, prefer uploading coverage.xml from the test job rather
  # than re-running the suite.

  build-windows:
    needs: [prepare, test, typecheck, lint]
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      KATRAIN_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python, uv
        uses: ./.github/actions/setup-python-uv

      - name: Build executables with PyInstaller
        run: uv run pyinstaller spec/KaTrain.spec --clean --noconfirm
        shell: powershell

      - name: Smoke-check wheel/sdist build
        run: uv build

      # Verify the build produced the expected artifacts before any
      # subsequent packaging/uploading step. Earlier the optional
      # 'Create archives' / 'Upload Windows artifacts' steps silently
      # succeeded even when PyInstaller produced nothing — the copy/
      # compress guarded by Test-Path would skip, and the workflow
      # still exited 0. Without this hard guard, a regression in the
      # spec/hiddenimports surface would ship as a "green" CI.
      - name: Verify PyInstaller outputs exist
        shell: powershell
        run: |
          $exit = 0
          if (-not (Test-Path "dist/KaTrain.exe")) {
              Write-Host "::error::dist/KaTrain.exe was not produced by PyInstaller."
              $exit = 1
          }
          if (-not (Test-Path "dist/KaTrain")) {
              Write-Host "::error::dist/KaTrain folder was not produced by PyInstaller."
              $exit = 1
          }
          exit $exit

      # Only build archives and upload artifacts on manual release runs
      # (workflow_dispatch with create_release=true). Pull-request runs
      # still execute PyInstaller to catch hiddenimports / spec breakage,
      # but they intentionally do NOT retain the ~448MB artifact.
      - name: Create archives
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true'
        run: |
          New-Item -ItemType Directory -Path "windows_exe" -Force

          # Copy the standalone KaTrain.exe
          Copy-Item "dist/KaTrain.exe" "windows_exe/KaTrain.exe"

          # Copy the debug executable into the main KaTrain folder
          if (Test-Path "dist/DebugKaTrain/KaTrain.exe") {
              Copy-Item "dist/DebugKaTrain/KaTrain.exe" "dist/KaTrain/debugkatrain.exe"
          }
          # Create the zip file
          Compress-Archive -Path "dist/KaTrain" -DestinationPath "windows_exe/KaTrain.zip"
        shell: powershell

      - name: Upload Windows artifacts (release runs only)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: KaTrainWindows-${{ env.KATRAIN_VERSION }}
          path: windows_exe
          if-no-files-found: error

  # This job creates a draft release on GitHub.
  create-release:
    needs: [prepare, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true'
    permissions:
      contents: write # Required for softprops/action-gh-release
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts
          pattern: KaTrain*
          merge-multiple: true

      - name: Create Draft Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ needs.prepare.outputs.version }}"
          name: "KaTrain v${{ needs.prepare.outputs.version }}"
          body: |
            ## KaTrain v${{ needs.prepare.outputs.version }}
            Auto-generated draft release from the latest main branch.

            ### Downloads
            - **Windows**: Download the `.exe` files or `.zip` folders.
          files: ./artifacts/*
          draft: true
          prerelease: false

  # Aggregator job used as the GitHub branch-protection required
  # check. It runs only after the canonical quality gates (lint, mypy,
  # test on every supported Python, coverage gate inside the 3.13
  # cell, windows PyInstaller build) all succeed. By gating only
  # this job in branch protection, we avoid the maintenance burden
  # of registering six individual checks (PR authors won't notice
  # when we add a new quality job).
  #
  # Phase C-main-protection.
  quality-gate:
    name: quality-gate
    needs: [lint, typecheck, test, build-windows]
    runs-on: ubuntu-latest
    if: always() && needs.lint.result == 'success' && needs.typecheck.result == 'success' && needs.test.result == 'success' && needs.build-windows.result == 'success'
    steps:
      - name: All quality checks passed
        run: |
          echo "lint:        ${{ needs.lint.result }}"
          echo "typecheck:   ${{ needs.typecheck.result }}"
          echo "test:        ${{ needs.test.result }}"
          echo "build-windows: ${{ needs.build-windows.result }}"
          echo "All required checks succeeded; safe to merge."
