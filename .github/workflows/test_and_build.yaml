# .github/workflows/test_and_build.yml

name: Test, Build, and Release

on:
  pull_request:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create draft release"
        required: true
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # This job runs first to prepare shared information for other jobs.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get project version
        id: version
        uses: ./.github/actions/get-version

  # Phase 112G: Type check with mypy (separate job for parallel execution)
  typecheck:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.11"
          sync-groups: dev

      - name: Type check with mypy
        run: uv run mypy katrain

  # Phase A-10: Lint with ruff (separate job for parallel execution)
  lint:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.11"
          sync-groups: dev

      - name: Lint and format check
        run: |
          uv run ruff check katrain tests
          uv run ruff format --check katrain tests

  test:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Phase 274-ci: add 3.13 to match .python-version / AGENTS.md primary env
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ matrix.python-version }}
          sync-groups: dev

      - name: Run tests
        env:
          KIVY_NO_FILELOG: 1
          KIVY_NO_CONSOLELOG: 1
          KIVY_NO_ENV_CONFIG: 1
          KIVY_NO_WINDOW: 1
          KIVY_GL_BACKEND: mock
          # GHA runners have no audio device. Without an explicit null
          # driver, SDL2's audio probe can abort hard (C-level, no Python
          # traceback) during collection when kivy/ffpyplayer load.
          SDL_AUDIODRIVER: dummy
          PYTHONUNBUFFERED: 1
          # Surface C-level fatal errors as a readable traceback instead of
          # the silent exit-102 we have been seeing.
          PYTEST_FAULTHANDLER: 1
        run: |
          # Show memory info before tests
          echo "=== Memory before tests ==="
          free -m || true
          # Run under Xvfb (virtual X server). This is the fix for the
          # long-standing exit-102 collection crash:
          #   - SDL_VIDEODRIVER=dummy (previously set here) makes kivy's
          #     window init abort with "Couldn't connect to X server".
          #   - Even with SDL_VIDEODRIVER unset, kivymd.material_resources
          #     calls dp(400) at module load -> EventLoop.ensure_window()
          #     -> sys.exit(1) when no display is available.
          # No combination of env vars avoids both; a real (virtual) X
          # server is required. Xvfb is preinstalled on ubuntu-latest.
          # SDL_VIDEODRIVER and DISPLAY are intentionally NOT set here:
          # xvfb-run -a provides a real display and manages DISPLAY itself.
          xvfb-run -a uv run python -X faulthandler -m pytest tests -v --tb=short 2>&1
          exit_code=$?
          echo "=== Memory after tests ==="
          free -m || true
          echo "Exit code: $exit_code"
          exit $exit_code

  # Phase 138-D: Coverage measurement (initial gate: 50%, raise over time)
  coverage:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.11"
          sync-groups: dev

      - name: Measure coverage and enforce gate
        env:
          KIVY_NO_FILELOG: 1
          KIVY_NO_CONSOLELOG: 1
          KIVY_NO_ENV_CONFIG: 1
          KIVY_NO_WINDOW: 1
          KIVY_GL_BACKEND: mock
          SDL_AUDIODRIVER: dummy
          PYTHONUNBUFFERED: 1
          PYTEST_FAULTHANDLER: 1
        run: |
          # Phase 138-D: Initial coverage gate at 40% (baseline observed: 46.87%)
          # Phase 138-D follow-up: Raise to 50% / 60% / 70% incrementally
          # Phase A-11: raise gate from 40% to 60% (observed coverage: 65%)
          # Run under Xvfb (virtual X server) for the same reason as the
          # test job: SDL_VIDEODRIVER=dummy + kivymd's module-level dp()
          # require a real (virtual) display on headless GHA runners.
          xvfb-run -a uv run python -X faulthandler -m pytest tests --cov=katrain --cov-fail-under=60 --tb=short 2>&1
          echo "Exit code: $?"

      - name: Check package can be built
        run: uv build

  build-windows:
    needs: [prepare, test, typecheck, lint]
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      KATRAIN_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python, uv
        uses: ./.github/actions/setup-python-uv

      - name: Build executables with PyInstaller
        run: uv run pyinstaller spec/KaTrain.spec --clean --noconfirm
        shell: powershell

      # Verify the build produced the expected artifacts before any
      # subsequent packaging/uploading step. Earlier the optional
      # 'Create archives' / 'Upload Windows artifacts' steps silently
      # succeeded even when PyInstaller produced nothing — the copy/
      # compress guarded by Test-Path would skip, and the workflow
      # still exited 0. Without this hard guard, a regression in the
      # spec/hiddenimports surface would ship as a "green" CI.
      - name: Verify PyInstaller outputs exist
        shell: powershell
        run: |
          $exit = 0
          if (-not (Test-Path "dist/KaTrain.exe")) {
              Write-Host "::error::dist/KaTrain.exe was not produced by PyInstaller."
              $exit = 1
          }
          if (-not (Test-Path "dist/KaTrain")) {
              Write-Host "::error::dist/KaTrain folder was not produced by PyInstaller."
              $exit = 1
          }
          exit $exit

      # Only build archives and upload artifacts on manual release runs
      # (workflow_dispatch with create_release=true). Pull-request runs
      # still execute PyInstaller to catch hiddenimports / spec breakage,
      # but they intentionally do NOT retain the ~448MB artifact.
      - name: Create archives
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true'
        run: |
          New-Item -ItemType Directory -Path "windows_exe" -Force

          # Copy the standalone KaTrain.exe
          Copy-Item "dist/KaTrain.exe" "windows_exe/KaTrain.exe"

          # Copy the debug executable into the main KaTrain folder
          if (Test-Path "dist/DebugKaTrain/KaTrain.exe") {
              Copy-Item "dist/DebugKaTrain/KaTrain.exe" "dist/KaTrain/debugkatrain.exe"
          }
          # Create the zip file
          Compress-Archive -Path "dist/KaTrain" -DestinationPath "windows_exe/KaTrain.zip"
        shell: powershell

      - name: Upload Windows artifacts (release runs only)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: KaTrainWindows-${{ env.KATRAIN_VERSION }}
          path: windows_exe
          if-no-files-found: error

  # This job creates a draft release on GitHub.
  create-release:
    needs: [prepare, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true'
    permissions:
      contents: write # Required for softprops/action-gh-release
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts
          pattern: KaTrain*
          merge-multiple: true

      - name: Create Draft Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ needs.prepare.outputs.version }}"
          name: "KaTrain v${{ needs.prepare.outputs.version }}"
          body: |
            ## KaTrain v${{ needs.prepare.outputs.version }}
            Auto-generated draft release from the latest main branch.

            ### Downloads
            - **Windows**: Download the `.exe` files or `.zip` folders.
          files: ./artifacts/*
          draft: true
          prerelease: false
