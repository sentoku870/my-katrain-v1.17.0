[project]
name = "KaTrain"
version = "1.17.1"
description = "Go/Baduk/Weiqi playing and teaching app with a variety of AIs"
authors = [{ name = "Sander Land" }]
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Board Games",
]
dependencies = [
    "screeninfo>=0.8.1,<0.9 ; platform_system != 'Darwin'",
    "chardet>=7",
    "ffpyplayer>=4.5.1",
    "pyyaml>=6.0.0,<7",
    "urllib3>=2.5.0,<3",
    "kivy>=2.3.1",
    "kivymd==1.2.0",
    "materialyoucolor>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/sanderland/katrain"

[project.scripts]
katrain = "katrain.__main__:run_app"

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "mypy>=1.8.0",
    "polib>=1.2.0,<2",
    "pyinstaller>=6.14.1",
    "pytest>=8.3.2,<10",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.6.0,<4",
    "types-PyYAML>=6.0.0",
]

[tool.uv]
default-groups = [
    "dev",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E402", "E501"] # Ignore module level import not at top of file, and line too long (formatter handles it)

[tool.ruff.lint.per-file-ignores]
# B017 (blind assertRaises(Exception)) is a deliberate pattern in tests
# that probe exception safety / graceful-degradation paths.
"tests/test_beginner_hints.py" = ["B017"]
"tests/test_typed_config_integration.py" = ["B017"]
"tests/test_utils_pack_floats.py" = ["B017"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    "tools",
    "docs",
    "build",
    "dist",
    "spec",
    ".venv",
    ".venv-linux",
    ".venv-new",
    ".venv-test",
    ".git",
    ".github",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "__pycache__",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests that initialize KaTrainBase (may be slow)",
    "kivy_headless: marks tests using KivyUnitTest headless infrastructure (Phase 146)",
]
# NOTE: pytest-xdist is intentionally left enabled. CI never passes ``-n``,
# so xdist never spawns workers there (a prior "exit code 102" was misdiagnosed
# as an xdist-worker segfault; xdist cannot segfault workers it never starts).
# Keeping the plugin enabled preserves the documented local parallel workflow
# ``uv run pytest tests -n auto``. If collection crashes recur, see the
# SDL_AUDIODRIVER / faulthandler hardening in the workflow.

[tool.coverage.run]
source = ["katrain"]
omit = [
    "katrain/KataGo/*",
    "katrain/__pycache__/*",
    "*/build/*",
    "katrain/gui/kv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = false

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
ignore_missing_imports = true

# Phase 112: Global strict flags
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
check_untyped_defs = true
strict_equality = true
extra_checks = true

# Phase 275-mypy2: extra error codes enforced under mypy 2.x so that
# deprecated APIs (e.g. datetime.utcnow, pkg_resources) surface as type
# errors during the next dep bump rather than silently.
enable_error_code = [
    "deprecated",
    "redundant-cast",
    "unused-awaitable",
]

[[tool.mypy.overrides]]
module = [
    "kivy.*",
    "kivymd.*",
]
ignore_missing_imports = true
ignore_errors = true

# Phase 275-mypy2: kivy_garden is a third-party stub used only as a
# placeholder in requirements. Keep ignore_missing_imports but drop
# ignore_errors so any code that touches it stays explicit.
[[tool.mypy.overrides]]
module = ["kivy_garden.*"]
ignore_missing_imports = true

# Tests have no type contracts (lots of monkeypatching + fixtures).
[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

[tool.hatch.build.targets.sdist]
include = ["katrain"]

[tool.hatch.build.targets.wheel]
include = ["katrain"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
